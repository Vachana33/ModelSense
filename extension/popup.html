<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Model Router</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111113;
      color: #e4e4e7;
      width: 240px;
      padding: 18px 16px 14px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .header-icon {
      font-size: 18px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: -0.01em;
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 10px;
    }

    .model-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .model-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1.5px solid rgba(255,255,255,0.07);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .model-option:hover {
      background: rgba(255,255,255,0.04);
    }

    .model-option.selected {
      border-color: #a78bfa;
      background: rgba(167, 139, 250, 0.1);
    }

    .model-option input[type="radio"] {
      accent-color: #a78bfa;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .model-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .model-name {
      font-weight: 600;
      font-size: 12.5px;
      color: #d4d4d8;
    }

    .model-desc {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }

    .save-btn {
      width: 100%;
      padding: 9px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 0.15s;
    }

    .save-btn:hover {
      background: #6d28d9;
    }

    .save-btn:active {
      background: #5b21b6;
    }

    .saved-msg {
      text-align: center;
      margin-top: 9px;
      font-size: 12px;
      color: #22c55e;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .saved-msg.visible {
      opacity: 1;
    }

    .privacy-note {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 10.5px;
      color: rgba(255,255,255,0.28);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">⚡</span>
    <span class="header-title">Claude Model Router</span>
  </div>

  <div class="section-label">Your current model</div>

  <div class="model-options">
    <label class="model-option" id="opt-haiku">
      <input type="radio" name="model" value="haiku">
      <div class="model-info">
        <span class="model-name">Claude Haiku</span>
        <span class="model-desc">Fast · Simple tasks</span>
      </div>
    </label>

    <label class="model-option" id="opt-sonnet">
      <input type="radio" name="model" value="sonnet">
      <div class="model-info">
        <span class="model-name">Claude Sonnet</span>
        <span class="model-desc">Balanced · Most tasks</span>
      </div>
    </label>

    <label class="model-option" id="opt-opus">
      <input type="radio" name="model" value="opus">
      <div class="model-info">
        <span class="model-name">Claude Opus</span>
        <span class="model-desc">Powerful · Complex reasoning</span>
      </div>
    </label>
  </div>

  <button class="save-btn" id="save-btn">Save</button>
  <div class="saved-msg" id="saved-msg">✓ Saved</div>

  <p class="privacy-note">
    Your prompt is analyzed locally in the browser. Nothing is sent to any external server.
  </p>

  <script src="popup.js"></script>
</body>
</html>
